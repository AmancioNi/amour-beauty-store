# Publica a página da Amour no GitHub Pages
name: Deploy static content to Pages

on:
  # Roda a cada push na branch principal (main ou master)
  push:
    branches: ["main", "master"]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Liga o GitHub Pages automaticamente se ainda não estiver ativado
          enablement: true

      - name: Conferir index.html
        run: |
          if [ ! -f index.html ]; then
            echo "::error::Não encontrei index.html na raiz do repositório. Renomeie o arquivo para index.html e coloque fora de pastas."
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
